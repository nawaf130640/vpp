[project]
name = "vpp"
version = "0.1.0"
description = "AI-powered Virtual Product Placement — backend research prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "torch>=2.12",
    "torchvision>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpp"]

# ---------------------------------------------------------------------------
# PyTorch source selection.
#
# LAPTOP / CODESPACES (default): CPU wheels from PyPI. Nothing to configure —
# `uv sync` pulls the CPU build, which is enough to run the stubbed pipeline.
#
# CLOUD GPU: uncomment the block below, set the index to match the box's
# driver (cu126 / cu128 / cu130 — pick the highest <= `nvidia-smi` CUDA
# version), then `uv sync`. The contracts and code do not change.
# ---------------------------------------------------------------------------
# [tool.uv.sources]
# torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
# torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'linux'" }]
#
# [[tool.uv.index]]
# name = "pytorch-cuda"
# url = "https://download.pytorch.org/whl/cu128"
# explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
